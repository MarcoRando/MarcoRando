<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} | {{ site.title }}</title>

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <!-- Font Awesome icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <img src="{{ '/images/profile.jpeg' | relative_url }}"
             alt="{{ site.author.name }}"
             class="profile-image">

        <h1>{{ site.author.name }}</h1>

        <p class="position">
            Postdoctoral Researcher<br>
            Department of Mathematics<br>
            Université Côte d'Azur, Inria, CNRS, LJAD
        </p>

        <p>
            <i class="fa-solid fa-location-dot"></i>
            Nice, France
        </p>

        <p>
            <a href="mailto:{{ site.author.email }}">
                <i class="fa-solid fa-envelope"></i>
                Email
            </a>
        </p>

        <p>
            <a href="{{ '/files/MarcoRando_CurriculumVitae.pdf' | relative_url }}"
               target="_blank"
               rel="noopener noreferrer">
                <i class="fa-solid fa-file-pdf"></i>
                Download CV
            </a>
        </p>

        <p>
            <a href="https://scholar.google.com/citations?user=5JrwG0sAAAAJ"
               target="_blank"
               rel="noopener noreferrer">
                <i class="fa-solid fa-graduation-cap"></i>
                Google Scholar
            </a>
        </p>

        <p>
            <a href="https://github.com/MarcoRando"
               target="_blank"
               rel="noopener noreferrer">
                <i class="fa-brands fa-github"></i>
                GitHub
            </a>
        </p>
        
        <p>
            <a href="https://www.linkedin.com/in/marco-rando-8085b6141"
               target="_blank"
               rel="noopener noreferrer">
                <i class="fa-brands fa-linkedin"></i>
                LinkedIn
            </a>
        </p>

        <p>
            <a href="https://orcid.org/0009-0008-3839-1429"
               target="_blank"
               rel="noopener noreferrer">
                <i class="fa-brands fa-orcid"></i>
                ORCID
            </a>
        </p>

    </aside>


    <main class="content">

        {{ content }}

    </main>

</div>

</body>
</html>
